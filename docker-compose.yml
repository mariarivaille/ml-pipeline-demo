version: '3.8'

services:
  gigachat-bot:
    # Для production: используем образ из Docker Hub
    image: ${DOCKER_USERNAME:-mariarivaille}/gigachat-bot:latest
    # Для local development: раскомментируйте строку ниже
    # build: .
    container_name: gigachat-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      # Для local dev: монтируем код для hot-reload
      # Для production: закомментируйте эту строку
      - ./app:/app/app
      - ./app/templates:/app/app/templates
    networks:
      - gigachat-network
    

  # Сервис для запуска тестов (опционально)
  test:
    build: .
    container_name: gigachat-tests
    env_file:
      - .env
    command: pytest tests/test_main.py -v
    profiles:
      - test
    networks:
      - gigachat-network

networks:
  gigachat-network:
    driver: bridge