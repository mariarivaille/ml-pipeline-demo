version: '3.8'

services:
  gigachat-bot:
    build: .
    container_name: gigachat-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - .:/app
  
  # Сервис для запуска тестов (запускается вручную)
  test:
    build: .
    container_name: gigachat-tests
    env_file:
      - .env
    command: pytest tests/ -v
    profiles:
      - test